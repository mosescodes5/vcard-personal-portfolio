<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Moses Kouakanou, Software Engineer">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060B"/><stop offset="1" stop-color="#0B1124"/></linearGradient><filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#0A84FF" stop-opacity="0"/><stop offset=".5" stop-color="#64D2FF"/><stop offset="1" stop-color="#5E5CE6" stop-opacity="0"/></linearGradient></defs>
