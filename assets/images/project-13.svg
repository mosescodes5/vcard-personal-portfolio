<svg viewBox="0 0 500 375" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f1e8"/>
      <stop offset="100%" stop-color="#efe4d2"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a44c"/>
      <stop offset="100%" stop-color="#e7c873"/>
    </linearGradient>
  </defs>

  <rect width="500" height="375" fill="url(#bgGrad)"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="500" height="34" fill="#1c1c1c"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>
  <rect x="150" y="8" width="220" height="18" rx="9" fill="#2e2e2e"/>
  <text x="260" y="21" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#bbbbbb" text-anchor="middle">taiwotea.com</text>

  <!-- nav -->
  <text x="30" y="65" font-family="Georgia, serif" font-size="20" fill="#1c1c1c">Orísirísi<tspan fill="#c9a44c">.</tspan>with Taiwo</text>
  <text x="470" y="63" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#555" text-anchor="end">Jewelry · Watch · Home · Juice</text>
  <line x1="0" y1="80" x2="500" y2="80" stroke="#e2d6c0" stroke-width="1"/>

  <!-- hero -->
  <text x="30" y="120" font-family="Georgia, serif" font-size="26" fill="#1c1c1c">Every sort of thing,</text>
  <text x="30" y="150" font-family="Georgia, serif" font-size="26" font-style="italic" fill="#1c1c1c">beautifully found.</text>
  <text x="30" y="178" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#6b6b6b">A curated assortment of jewelry, wristwatches,</text>
  <text x="30" y="194" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#6b6b6b">household items and fresh juice.</text>

  <rect x="30" y="212" width="150" height="34" rx="17" fill="#1c1c1c"/>
  <text x="105" y="234" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">Shop the assortment</text>

  <!-- product grid -->
  <g>
    <rect x="270" y="100" width="90" height="110" rx="10" fill="#e9dcc4"/>
    <circle cx="315" cy="140" r="18" fill="url(#chipGrad)"/>
    <text x="315" y="180" font-family="Poppins, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Jewelry</text>

    <rect x="368" y="100" width="102" height="110" rx="10" fill="#ded0ea"/>
    <rect x="398" y="122" width="42" height="42" rx="21" fill="#8f7bb0"/>
    <text x="419" y="180" font-family="Poppins, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Wristwatch</text>
  </g>

  <g>
    <rect x="270" y="220" width="90" height="110" rx="10" fill="#d9e6dd"/>
    <rect x="292" y="245" width="46" height="34" rx="6" fill="#6f9c82"/>
    <text x="315" y="300" font-family="Poppins, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Household</text>

    <rect x="368" y="220" width="102" height="110" rx="10" fill="#f3d9c8"/>
    <rect x="404" y="242" width="28" height="40" rx="6" fill="#d98b4f"/>
    <text x="419" y="300" font-family="Poppins, Arial, sans-serif" font-size="9" fill="#555" text-anchor="middle">Fresh Juice</text>
  </g>

  <text x="30" y="340" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#8a8a8a">320+ pieces added this month · Nationwide delivery in Nigeria</text>
</svg>
