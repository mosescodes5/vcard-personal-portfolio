<svg viewBox="0 0 500 375" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gcBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#150c24"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>
    <radialGradient id="gcGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="375" fill="url(#gcBg)"/>
  <rect width="500" height="375" fill="url(#gcGlow)"/>

  <rect x="0" y="0" width="500" height="34" fill="#08050f"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>
  <rect x="150" y="8" width="220" height="18" rx="9" fill="#1e1530"/>
  <text x="260" y="21" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#c9a9e0" text-anchor="middle">gaming-concept.vercel.app</text>

  <!-- controller icon -->
  <g transform="translate(250,150)">
    <rect x="-90" y="-30" width="180" height="70" rx="35" fill="#1e1530" stroke="#a855f7" stroke-width="2"/>
    <circle cx="-45" cy="0" r="14" fill="none" stroke="#e879f9" stroke-width="3"/>
    <line x1="-45" y1="-9" x2="-45" y2="9" stroke="#e879f9" stroke-width="3"/>
    <line x1="-54" y1="0" x2="-36" y2="0" stroke="#e879f9" stroke-width="3"/>
    <circle cx="45" cy="-8" r="8" fill="#e879f9"/>
    <circle cx="65" cy="8" r="8" fill="#a855f7"/>
    <circle cx="25" cy="8" r="8" fill="#a855f7" opacity="0.6"/>
  </g>

  <text x="250" y="245" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Level Up Your Play</text>
  <text x="250" y="266" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#c9a9e0" text-anchor="middle">A dark, glow-driven concept UI for competitive gaming</text>

  <rect x="185" y="285" width="130" height="32" rx="16" fill="none" stroke="#e879f9" stroke-width="1.5"/>
  <text x="250" y="306" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#e879f9" text-anchor="middle">Explore Concept</text>
</svg>
