<svg viewBox="0 0 500 375" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161022"/>
      <stop offset="100%" stop-color="#0d0b17"/>
    </linearGradient>
  </defs>
  <rect width="500" height="375" fill="url(#rbBg)"/>

  <rect x="0" y="0" width="500" height="34" fill="#0a0812"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>
  <rect x="150" y="8" width="220" height="18" rx="9" fill="#1e1a2b"/>
  <text x="260" y="21" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#a99fc2" text-anchor="middle">rubik-s-cube.vercel.app</text>

  <text x="30" y="70" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Rubik's Cube Game</text>
  <text x="30" y="90" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#8a7fa3">Interactive 3D puzzle · JavaScript &amp; CSS3</text>

  <!-- isometric cube faces -->
  <g transform="translate(250,210)">
    <!-- top face -->
    <polygon points="0,-90 78,-45 0,0 -78,-45" fill="#f5f5f5" stroke="#0d0b17" stroke-width="2"/>
    <line x1="-26,-77" x2="-26,-30" stroke="#0d0b17" stroke-width="2"/>
    <line x1="26,-77" x2="26,-30" stroke="#0d0b17" stroke-width="2"/>
    <line x1="-52,-60" x2="52,-15" stroke="#0d0b17" stroke-width="2" opacity="0"/>

    <!-- left face (purple shades) -->
    <polygon points="-78,-45 0,0 0,90 -78,45" fill="#7c3aed" stroke="#0d0b17" stroke-width="2"/>
    <!-- right face (pink shades) -->
    <polygon points="78,-45 0,0 0,90 78,45" fill="#e879f9" stroke="#0d0b17" stroke-width="2"/>
  </g>

  <!-- grid lines to suggest 3x3 segments -->
  <g stroke="#0d0b17" stroke-width="2" opacity="0.9">
    <line x1="172" y1="165" x2="250" y2="120"/>
    <line x1="172" y1="195" x2="250" y2="150"/>
    <line x1="198" y1="240" x2="198" y2="150"/>
    <line x1="224" y1="255" x2="224" y2="165"/>

    <line x1="328" y1="165" x2="250" y2="120"/>
    <line x1="328" y1="195" x2="250" y2="150"/>
    <line x1="302" y1="240" x2="302" y2="150"/>
    <line x1="276" y1="255" x2="276" y2="165"/>
  </g>

  <text x="30" y="345" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#8a7fa3">Drag-to-rotate mechanics · Move counter · Timer</text>
</svg>
