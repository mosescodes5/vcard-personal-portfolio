<svg viewBox="0 0 500 375" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="snBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0b17"/>
      <stop offset="100%" stop-color="#171025"/>
    </linearGradient>
  </defs>
  <rect width="500" height="375" fill="url(#snBg)"/>

  <rect x="0" y="0" width="500" height="34" fill="#0a0812"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="17" r="5" fill="#febc2e"/>
  <circle cx="54" cy="17" r="5" fill="#28c840"/>
  <rect x="150" y="8" width="220" height="18" rx="9" fill="#1e1a2b"/>
  <text x="260" y="21" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#a99fc2" text-anchor="middle">snake-game-neon.vercel.app</text>

  <text x="30" y="65" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Snake Game</text>
  <text x="30" y="84" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#8a7fa3">Neon arcade classic · Canvas &amp; JavaScript</text>

  <!-- game grid -->
  <rect x="90" y="100" width="320" height="220" rx="8" fill="#0a0812" stroke="#3a2f57" stroke-width="1.5"/>

  <!-- grid dots -->
  <g fill="#241c38">
    <circle cx="110" cy="120" r="1.5"/><circle cx="130" cy="120" r="1.5"/><circle cx="150" cy="120" r="1.5"/>
    <circle cx="170" cy="120" r="1.5"/><circle cx="190" cy="120" r="1.5"/><circle cx="210" cy="120" r="1.5"/>
  </g>

  <!-- neon snake path -->
  <g fill="none" stroke="#e879f9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M130,290 L130,250 L170,250 L170,210 L230,210 L230,170 L270,170"/>
  </g>
  <g fill="none" stroke="#c026d3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <path d="M130,290 L130,250 L170,250 L170,210 L230,210 L230,170 L270,170"/>
  </g>

  <!-- snake head -->
  <circle cx="270" cy="170" r="10" fill="#f0abfc"/>

  <!-- food -->
  <circle cx="330" cy="140" r="7" fill="#a78bfa"/>

  <text x="90" y="340" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#8a7fa3">Score: 240 · High score tracking · Keyboard controls</text>
</svg>
