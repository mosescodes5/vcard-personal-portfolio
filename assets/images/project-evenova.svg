    <rect x="30" y="292" width="427" height="60" rx="12" fill="#1a1528" stroke="#3a2f57" stroke-width="1"/>
    <rect x="42" y="304" width="36" height="36" rx="4" fill="#ffffff"/>
    <rect x="47" y="309" width="6" height="6" fill="#0d0b17"/>
    <rect x="57" y="309" width="6" height="6" fill="#0d0b17"/>
    <rect x="67" y="309" width="6" height="6" fill="#0d0b17"/>
    <rect x="47" y="319" width="6" height="6" fill="#0d0b17"/>
    <rect x="67" y="319" width="6" height="6" fill="#0d0b17"/>
    <rect x="47" y="329" width="6" height="6" fill="#0d0b17"/>
    <rect x="57" y="329" width="6" height="6" fill="#0d0b17"/>
    <rect x="67" y="329" width="6" height="6" fill="#0d0b17"/>
